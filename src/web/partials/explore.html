<section id="exploreView" hidden>
  <div class="xcontrols">
    <div class="xcontrols-top">
      <input
        id="xq"
        type="search"
        placeholder="Search skills across skills.sh, marketplaces, SkillsMP, awesome-lists, ClawHub…"
      />
      <span id="xmeta"></span>
      <div class="spacer"></div>
      <button id="xrefresh" title="Clear provider catalogs and re-sync on next search">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
        <span id="xrefreshLabel">Refresh catalogs</span>
      </button>
    </div>
    <div class="xprov-bar" id="xprovFilters" role="group" aria-label="Providers"></div>
  </div>
  <div id="xlisthead" class="xgrid">
    <span class="h"><span class="sq c-name"></span>Name</span>
    <span class="h">Description</span>
    <span class="h"><span class="sq c-src"></span>Provider</span>
    <span class="h r"><span class="sq c-inst"></span>Installs</span>
    <span class="h r"><span class="sq c-use"></span>Action</span>
  </div>
  <div id="xlist"></div>
  <div id="xempty">
    <p>No results yet.</p>
    <p class="note">
      Type a query to search skills.sh, Claude marketplaces, SkillsMP, awesome-lists and ClawHub.
    </p>
  </div>
  <div id="xerr" hidden></div>
</section>
